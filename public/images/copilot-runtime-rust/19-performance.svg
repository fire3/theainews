<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">From pre-port TypeScript to post-port Rust</title><desc id="desc">May 12 versus August 21: warmed client lifecycle time, shared-client one-turn session lifecycle throughput, and ten-client memory pressure.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:28px;font-weight:700;fill:#24292f}.subtitle{font-size:15px;fill:#57606a}.label{font-size:13px;fill:#57606a}.small{font-size:11px;fill:#57606a}.value{font-size:13px;font-weight:600;fill:#24292f}.annotation{font-size:12px;font-weight:600;fill:#24292f}</style><rect width="1200" height="530" rx="16" fill="white"></rect><text class="title" x="54" y="54">From pre-port TypeScript to post-port Rust</text><text class="subtitle" x="54" y="82">May 12 versus August 21: warmed client lifecycle, shared-client throughput, and ten-client memory pressure.</text><rect x="54.0" y="132.0" width="338.0" height="360.0" rx="12" fill="#f6f8fa" opacity="1"></rect><text class="annotation" x="78.0" y="168.0" text-anchor="start" fill="#24292f">Client, session, one turn</text><text class="small" x="78.0" y="190.0" text-anchor="start">create, run one turn, and dispose; lower is better</text><text class="label" x="78.0" y="234.0" text-anchor="start" fill="#24292f">May 12 pre-port</text><text class="value" x="368.0" y="234.0" text-anchor="end">5.25 s</text><rect x="78.0" y="246.0" width="290.0" height="18.0" rx="9" fill="#d8dee4" opacity="0.45"></rect><rect x="78.0" y="246.0" width="290.0" height="18.0" rx="9" fill="#cf222e" opacity="1"></rect><text class="label" x="78.0" y="308.0" text-anchor="start" fill="#24292f">Aug 21 Rust OOP</text><text class="value" x="368.0" y="308.0" text-anchor="end">520 ms</text><rect x="78.0" y="320.0" width="290.0" height="18.0" rx="9" fill="#d8dee4" opacity="0.45"></rect><rect x="78.0" y="320.0" width="28.7" height="18.0" rx="9" fill="#bf8700" opacity="1"></rect><text class="label" x="78.0" y="382.0" text-anchor="start" fill="#24292f">Aug 21 Rust FFI</text><text class="value" x="368.0" y="382.0" text-anchor="end">55.3 ms</text><rect x="78.0" y="394.0" width="290.0" height="18.0" rx="9" fill="#d8dee4" opacity="0.45"></rect><rect x="78.0" y="394.0" width="5.0" height="18.0" rx="9" fill="#1a7f37" opacity="1"></rect><rect x="420.0" y="132.0" width="338.0" height="360.0" rx="12" fill="#f6f8fa" opacity="1"></rect><text class="annotation" x="444.0" y="168.0" text-anchor="start" fill="#24292f">Shared-client throughput</text><text class="small" x="444.0" y="190.0" text-anchor="start">one-turn session lifecycles / sec, higher is better</text><text class="label" x="444.0" y="234.0" text-anchor="start" fill="#24292f">May 12 pre-port</text><text class="value" x="734.0" y="234.0" text-anchor="end">7.55 / sec</text><rect x="444.0" y="246.0" width="290.0" height="18.0" rx="9" fill="#d8dee4" opacity="0.45"></rect><rect x="444.0" y="246.0" width="18.2" height="18.0" rx="9" fill="#cf222e" opacity="1"></rect><text class="label" x="444.0" y="308.0" text-anchor="start" fill="#24292f">Aug 21 Rust OOP</text><text class="value" x="734.0" y="308.0" text-anchor="end">57.45 / sec</text><rect x="444.0" y="320.0" width="290.0" height="18.0" rx="9" fill="#d8dee4" opacity="0.45"></rect><rect x="444.0" y="320.0" width="138.8" height="18.0" rx="9" fill="#bf8700" opacity="1"></rect><text class="label" x="444.0" y="382.0" text-anchor="start" fill="#24292f">Aug 21 Rust FFI</text><text class="value" x="734.0" y="382.0" text-anchor="end">120.0 / sec</text><rect x="444.0" y="394.0" width="290.0" height="18.0" rx="9" fill="#d8dee4" opacity="0.45"></rect><rect x="444.0" y="394.0" width="290.0" height="18.0" rx="9" fill="#1a7f37" opacity="1"></rect><rect x="786.0" y="132.0" width="338.0" height="360.0" rx="12" fill="#f6f8fa" opacity="1"></rect><text class="annotation" x="810.0" y="168.0" text-anchor="start" fill="#24292f">Ten-client memory</text><text class="small" x="810.0" y="190.0" text-anchor="start">private working-set peak delta (MB), lower is better</text><text class="label" x="810.0" y="234.0" text-anchor="start" fill="#24292f">May 12 pre-port</text><text class="value" x="1100.0" y="234.0" text-anchor="end">1,383 MB</text><rect x="810.0" y="246.0" width="290.0" height="18.0" rx="9" fill="#d8dee4" opacity="0.45"></rect><rect x="810.0" y="246.0" width="290.0" height="18.0" rx="9" fill="#cf222e" opacity="1"></rect><text class="label" x="810.0" y="308.0" text-anchor="start" fill="#24292f">Aug 21 Rust OOP</text><text class="value" x="1100.0" y="308.0" text-anchor="end">247 MB</text><rect x="810.0" y="320.0" width="290.0" height="18.0" rx="9" fill="#d8dee4" opacity="0.45"></rect><rect x="810.0" y="320.0" width="51.8" height="18.0" rx="9" fill="#bf8700" opacity="1"></rect><text class="label" x="810.0" y="382.0" text-anchor="start" fill="#24292f">Aug 21 Rust FFI</text><text class="value" x="1100.0" y="382.0" text-anchor="end">126 MB</text><rect x="810.0" y="394.0" width="290.0" height="18.0" rx="9" fill="#d8dee4" opacity="0.45"></rect><rect x="810.0" y="394.0" width="26.5" height="18.0" rx="9" fill="#1a7f37" opacity="1"></rect></svg> 