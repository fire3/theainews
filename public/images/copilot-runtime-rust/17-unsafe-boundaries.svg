<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Unsafe blocks for external boundaries</title><desc id="desc">The runtime contains 158 unsafe blocks: 51 at the C ABI boundary, 49 for the Windows API, 46 for POSIX or libc, seven for the SQLite C API, four for dynamic library loading, and one for process environment mutation.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:28px;font-weight:700;fill:#24292f}.subtitle{font-size:15px;fill:#57606a}.center-value{font-size:42px;font-weight:700;fill:#24292f}.center-label{font-size:15px;fill:#57606a}.legend-title{font-size:15px;font-weight:600;fill:#24292f}.legend-value{font-size:14px;fill:#57606a}.annotation{font-size:13px;font-weight:600;fill:#1a7f37}</style><rect width="1200" height="500" rx="16" fill="white"></rect><text class="title" x="54" y="54">Unsafe blocks for external boundaries</text><circle cx="300" cy="287" r="130" fill="none" stroke="#d8dee4" stroke-width="62"></circle><g transform="rotate(-90 300 287)"><circle cx="300" cy="287" r="130" pathLength="100" fill="none" stroke="#0969da" stroke-width="62" stroke-dasharray="32.2785 67.7215" stroke-dashoffset="0"></circle><circle cx="300" cy="287" r="130" pathLength="100" fill="none" stroke="#1a7f37" stroke-width="62" stroke-dasharray="31.0127 68.9873" stroke-dashoffset="-32.2785"></circle><circle cx="300" cy="287" r="130" pathLength="100" fill="none" stroke="#bc4c00" stroke-width="62" stroke-dasharray="29.1139 70.8861" stroke-dashoffset="-63.2912"></circle><circle cx="300" cy="287" r="130" pathLength="100" fill="none" stroke="#8250df" stroke-width="62" stroke-dasharray="4.4304 95.5696" stroke-dashoffset="-92.4051"></circle><circle cx="300" cy="287" r="130" pathLength="100" fill="none" stroke="#bf3989" stroke-width="62" stroke-dasharray="2.5316 97.4684" stroke-dashoffset="-96.8355"></circle><circle cx="300" cy="287" r="130" pathLength="100" fill="none" stroke="#6e7781" stroke-width="62" stroke-dasharray="0.6329 99.3671" stroke-dashoffset="-99.3671"></circle></g><text class="center-value" x="300" y="285" text-anchor="middle">158</text><text class="center-label" x="300" y="312" text-anchor="middle">unsafe blocks</text><rect x="540" y="142" width="18" height="18" rx="3" fill="#0969da"></rect><text class="legend-title" x="574" y="157">C ABI boundary</text><text class="legend-value" x="1080" y="157" text-anchor="end">51 blocks / 32.3%</text><rect x="540" y="192" width="18" height="18" rx="3" fill="#1a7f37"></rect><text class="legend-title" x="574" y="207">Windows API</text><text class="legend-value" x="1080" y="207" text-anchor="end">49 blocks / 31.0%</text><rect x="540" y="242" width="18" height="18" rx="3" fill="#bc4c00"></rect><text class="legend-title" x="574" y="257">POSIX / libc</text><text class="legend-value" x="1080" y="257" text-anchor="end">46 blocks / 29.1%</text><rect x="540" y="292" width="18" height="18" rx="3" fill="#8250df"></rect><text class="legend-title" x="574" y="307">SQLite C API</text><text class="legend-value" x="1080" y="307" text-anchor="end">7 blocks / 4.4%</text><rect x="540" y="342" width="18" height="18" rx="3" fill="#bf3989"></rect><text class="legend-title" x="574" y="357">Dynamic library loading</text><text class="legend-value" x="1080" y="357" text-anchor="end">4 blocks / 2.5%</text><rect x="540" y="392" width="18" height="18" rx="3" fill="#6e7781"></rect><text class="legend-title" x="574" y="407">Process environment</text><text class="legend-value" x="1080" y="407" text-anchor="end">1 block / 0.6%</text></svg> 