<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">Recurring correctness-regression failure modes</title><desc id="desc">Five recurring failure modes observed during the migration, shown without quantities.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:28px;font-weight:700;fill:#24292f}.heading{font-size:16px;font-weight:600;fill:#24292f}.detail{font-size:13px;fill:#57606a}</style><rect width="1200" height="410" rx="16" fill="white"></rect><text class="title" x="54" y="54">Recurring correctness-regression failure modes</text><rect x="54" y="116" width="340" height="108" rx="10" fill="#ddf4ff"></rect><rect x="54" y="116" width="8" height="108" rx="4" fill="#0969da"></rect><text class="heading" x="82" y="153">Incomplete or inconsistent migration</text><text class="detail" x="82" y="180">Omitted paths, partial ports, and rebase loss</text><rect x="430" y="116" width="340" height="108" rx="10" fill="#dafbe1"></rect><rect x="430" y="116" width="8" height="108" rx="4" fill="#1a7f37"></rect><text class="heading" x="458" y="153">State, ownership, and lifetime</text><text class="detail" x="458" y="180">Lifecycle, disposal, ordering, races, and host state</text><rect x="806" y="116" width="340" height="108" rx="10" fill="#fff1e5"></rect><rect x="806" y="116" width="8" height="108" rx="4" fill="#bc4c00"></rect><text class="heading" x="834" y="153">Behavioral contract mismatch</text><text class="detail" x="834" y="180">Reasonable translations that changed behavior</text><rect x="242" y="252" width="340" height="108" rx="10" fill="#fbefff"></rect><rect x="242" y="252" width="8" height="108" rx="4" fill="#8250df"></rect><text class="heading" x="270" y="289">Host and boundary integration</text><text class="detail" x="270" y="316">FFI, platform, and ecosystem assumptions</text><rect x="618" y="252" width="340" height="108" rx="10" fill="#ffeff7"></rect><rect x="618" y="252" width="8" height="108" rx="4" fill="#bf3989"></rect><text class="heading" x="646" y="289">Incorrect correctness oracle</text><text class="detail" x="646" y="316">Tests that confidently validated the wrong behavior</text></svg> 