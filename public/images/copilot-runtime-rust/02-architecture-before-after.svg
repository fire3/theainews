<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Architecture</title><desc id="desc">Before the rewrite, every SDK host communicated over JSON-RPC with a separate Copilot CLI process containing the TypeScript runtime, Node.js, and V8. After the rewrite, SDK hosts can load the Rust runtime in-process through FFI or use it as a separate JSON-RPC server over stdio.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"></path></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:28px;font-weight:700;fill:#24292f}.subtitle{font-size:15px;fill:#57606a}.panel-title{font-size:18px;font-weight:700;fill:#24292f}.mode{font-size:14px;font-weight:700;fill:#24292f}.box-title{font-size:14px;font-weight:700;fill:#24292f}.label{font-size:13px;fill:#57606a}.small{font-size:11px;fill:#57606a}.callout{font-size:13px;font-weight:600}.inverse{fill:white}</style><rect width="1200" height="600" rx="16" fill="white"></rect><text class="title" x="54" y="54">Architecture</text><rect x="54" y="90" width="520" height="470" rx="14" fill="#f6f8fa"></rect><text class="panel-title" x="80" y="154">Before: SDK layered over the CLI</text><text class="small" x="80" y="180">SDK host process</text><rect x="80" y="188" width="190" height="340" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 5"></rect><rect x="101" y="242" width="148" height="66" rx="8" fill="#d8dee4"></rect><text class="box-title" x="175" y="270" text-anchor="middle">App code</text><text class="small" x="175" y="290" text-anchor="middle">C#, TS, Python, Go, Java, Rust</text><line x1="175" y1="309" x2="175" y2="350" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"></line><rect x="101" y="356" width="148" height="66" rx="8" 