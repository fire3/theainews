<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Prompt-cache composition</title><desc id="desc">Of all input-side token volume across the porting sessions, 96.22 percent was read from cache, 3.07 percent was written to cache, and 0.71 percent was fresh input.</desc><defs><clipPath id="bar-clip"><rect x="70" y="128" width="1060" height="58" rx="12"></rect></clipPath></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:28px;font-weight:700;fill:#24292f}.subtitle{font-size:15px;fill:#57606a}.label{font-size:14px;fill:#24292f}.small{font-size:12px;fill:#57606a}.percent{font-size:23px;font-weight:700}.inside{font-size:20px;font-weight:700;fill:white}</style><rect width="1200" height="390" rx="16" fill="white"></rect><text class="title" x="54" y="54">Prompt-cache composition</text><text class="subtitle" x="54" y="82">Share of input-side token volume across the porting sessions</text><g clip-path="url(#bar-clip)"><rect x="70" y="128" width="1019.93" height="58" fill="#1a7f37"></rect><rect x="1089.93" y="128" width="32.54" height="58" fill="#bf8700"></rect><rect x="1122.47" y="128" width="7.53" height="58" fill="#cf222e"></rect></g><text class="inside" x="579.96" y="165" text-anchor="middle">96.22% cache reads</text><rect x="70" y="230" width="320" height="100" rx="10" fill="#dafbe1"></rect><rect x="70" y="230" width="8" height="100" rx="4" fill="#1a7f37"></rect><text class="percent" x="98" y="270" fill="#1a7f37">96.22%</text><text class="label" x="98" y="298">Cache reads</text><rect x="440" y="230" width="320" height="100" rx="10" fill="#fff8c5"></rect><rect x="440" y="230" width="8" height="100" rx="4" fill="#bf8700"></rect><text class="percent" x="468" y="270" fill="#9a6700">3.07%</text><text class="label" x="468" y="298">Cache writes</text><rect x="810" y="230" width="320" height="100" rx="10" fill="#ffebe9"></rect><rect x="810" y="230" width="8" height="100" rx="4" fill="#cf222e"></rect><text class="percent" x="838" y="270" fill="#cf222e">0.71%</text><text class="label" x="838" y="298">Fresh input</text></svg> 