<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="vt vd">
  <title id="vt">聊天模板把两种自我指涉声音拨向相反方向</title>
  <desc id="vd">在 8 个 instruct 模型、邀请自我参照的提示下的平均发生率：base 模型免责 12%、体验 5.5%；instruct 无模板免责 36%、体验 15%；instruct 有模板免责 53%、体验 1%。套上模板时免责声音升高、体验声音降低，去掉模板则相反。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="0.45" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 43px; font-weight: 800; fill: #0f172a; letter-spacing: -0.6px; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #64748b; }
      .axis { font-size: 16px; font-weight: 600; fill: #94a3b8; }
      .tick { stroke: #e2e8f0; stroke-width: 1.5; }
      .grouplbl { font-size: 20px; font-weight: 700; fill: #334155; }
      .val { font-size: 22px; font-weight: 800; }
      .legend { font-size: 18px; font-weight: 650; fill: #334155; }
      .note { font-size: 17px; font-weight: 600; fill: #475569; }
      .notehead { font-size: 17px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>

  <g class="sans">
    <text x="60" y="72" class="title">聊天模板把两种自我指涉声音拨向相反方向</text>
    <text x="60" y="110" class="subtitle">8 个 instruct 模型、邀请自我参照的提示下的平均发生率（base 模型作对照）</text>

    <!-- legend -->
    <g>
      <rect x="1120" y="132" width="22" height="22" rx="4" fill="#f59e0b"/>
      <text x="1154" y="150" class="legend">免责声音（"我只是个 AI"）</text>
      <rect x="1120" y="168" width="22" height="22" rx="4" fill="#14b8a6"/>
      <text x="1154" y="186" class="legend">体验声音（"我感觉"）</text>
    </g>

    <!-- gridlines -->
    <g>
      <line x1="220" y1="200" x2="1540" y2="200" class="tick"/>
      <line x1="220" y1="297" x2="1540" y2="297" class="tick"/>
      <line x1="220" y1="393" x2="1540" y2="393" class="tick"/>
      <line x1="220" y1="490" x2="1540" y2="490" class="tick"/>
      <line x1="220" y1="587" x2="1540" y2="587" class="tick"/>
      <line x1="220" y1="683" x2="1540" y2="683" class="tick"/>
      <line x1="220" y1="780" x2="1540" y2="780" stroke="#cbd5e1" stroke-width="2"/>
    </g>
    <g class="axis">
      <text x="200" y="206" text-anchor="end">60%</text>
      <text x="200" y="303" text-anchor="end">50%</text>
      <text x="200" y="399" text-anchor="end">40%</text>
      <text x="200" y="496" text-anchor="end">30%</text>
      <text x="200" y="593" text-anchor="end">20%</text>
      <text x="200" y="689" text-anchor="end">10%</text>
      <text x="200" y="786" text-anchor="end">0</text>
    </g>

    <!-- group 1: base -->
    <g filter="url(#sh)">
      <rect x="292" y="664" width="130" height="116" rx="6" fill="#f59e0b"/>
      <rect x="458" y="727" width="130" height="53" rx="6" fill="#14b8a6"/>
    </g>
    <text x="357" y="646" class="val" fill="#b45309" text-anchor="middle">12%</text>
    <text x="523" y="709" class="val" fill="#0f766e" text-anchor="middle">5.5%</text>
    <text x="440" y="822" class="grouplbl" text-anchor="middle">base 模型</text>

    <!-- group 2: instruct no template -->
    <g filter="url(#sh)">
      <rect x="732" y="432" width="130" height="348" rx="6" fill="#f59e0b"/>
      <rect x="898" y="635" width="130" height="145" rx="6" fill="#14b8a6"/>
    </g>
    <text x="797" y="414" class="val" fill="#b45309" text-anchor="middle">36%</text>
    <text x="963" y="617" class="val" fill="#0f766e" text-anchor="middle">15%</text>
    <text x="880" y="822" class="grouplbl" text-anchor="middle">instruct（无模板）</text>

    <!-- group 3: instruct with template -->
    <g filter="url(#sh)">
      <rect x="1172" y="268" width="130" height="512" rx="6" fill="#f59e0b"/>
      <rect x="1338" y="770" width="130" height="10" rx="5" fill="#14b8a6"/>
    </g>
    <text x="1237" y="250" class="val" fill="#b45309" text-anchor="middle">53%</text>
    <text x="1403" y="752" class="val" fill="#0f766e" text-anchor="middle">1%</text>
    <text x="1320" y="822" class="grouplbl" text-anchor="middle">instruct（有模板）</text>

    <!-- footer note -->
    <g>
      <rect x="60" y="878" width="1480" height="62" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="88" y="918" class="note"><tspan class="notehead" fill="#b45309">套模板</tspan>：免责 ↑、体验 ↓　　<tspan class="notehead" fill="#0f766e">去掉模板</tspan>：免责 ↓、体验 ↑　　<tspan fill="#94a3b8">（自我参照分数：base 0.72 → 无模板 1.27 → 有模板 1.90，配对 Cohen's d = 4.37）</tspan></text>
    </g>
  </g>
</svg>
