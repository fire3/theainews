<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">HiSparse 主机分层</title>
  <desc id="desc">稀疏 MLA 解码时，每张 GPU 为每个请求保留一个热缓冲以承载 top-k 命中的 KV 页；当显存吃紧时，KV 页被溢出到 pinned host memory 的主机驻留层，该层在 TP rank 之间共享。top-k 未命中时从主机内存取回并补齐到热缓冲，以取数延迟换取远大于显存的可用容量。</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="0.34" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #0f172a; letter-spacing: -0.6px; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #64748b; }
      .zone { font-size: 25px; font-weight: 800; }
      .zone-sub { font-size: 15px; font-weight: 700; fill: #64748b; }
      .box { font-size: 22px; font-weight: 800; fill: #172033; }
      .line { font-size: 16px; font-weight: 500; fill: #55637a; }
      .edge { font-size: 15px; font-weight: 700; fill: #64748b; }
      .foot { font-size: 16px; font-weight: 650; fill: #475569; }
      .panelhead { font-size: 19px; font-weight: 800; fill: #172033; }
    </style>
  </defs>

  <rect width="1600" height="840" fill="url(#page-bg)"/>

  <g class="sans">
    <text x="60" y="72" class="title">HiSparse：稀疏 MLA 解码的主机分层</text>
    <text x="60" y="110" class="subtitle">top-k 未命中从 pinned host memory 补齐，用取数延迟换取远超显存的可用容量</text>

    <!-- GPU zone -->
    <g filter="url(#shadow)">
      <rect x="50" y="165" width="760" height="440" rx="20" fill="#ffffff" stroke="#c7d9f5" stroke-width="1.8"/>
    </g>
    <text x="80" y="212" class="zone" fill="#1d4ed8">GPU 显存</text>
    <text x="80" y="240" class="zone-sub">稀疏 MLA 解码路径</text>

    <g filter="url(#shadow)">
      <rect x="90" y="272" width="680" height="140" rx="14" fill="#eef4ff" stroke="#bfdbfe" stroke-width="1.5"/>
    </g>
    <text x="118" y="316" class="box">每请求热缓冲</text>
    <text x="118" y="348" class="line">承载 top-k 命中的 KV 页</text>
    <text x="118" y="376" class="line">请求级隔离，命中即用</text>

    <g filter="url(#shadow)">
      <rect x="90" y="444" width="680" height="130" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>
    <text x="118" y="486" class="box">注意力内核</text>
    <text x="118" y="518" class="line">只取每个 query 的 top-k 个 KV 块</text>
    <text x="118" y="546" class="line">未命中即向外层发起补齐</text>

    <!-- host zone -->
    <g filter="url(#shadow)">
      <rect x="880" y="165" width="670" height="440" rx="20" fill="#ffffff" stroke="#f3c6c2" stroke-width="1.8"/>
    </g>
    <text x="910" y="212" class="zone" fill="#b91c1c">pinned host memory</text>
    <text x="910" y="240" class="zone-sub">主机驻留层</text>

    <g filter="url(#shadow)">
      <rect x="920" y="272" width="590" height="140" rx="14" fill="#fff7f6" stroke="#f3c6c2" stroke-width="1.5"/>
    </g>
    <text x="948" y="316" class="box">KV 页溢出存储</text>
    <text x="948" y="348" class="line">显存吃紧时把 KV 页落在这里</text>
    <text x="948" y="376" class="line">容量远大于显存</text>

    <g filter="url(#shadow)">
      <rect x="920" y="444" width="590" height="130" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>
    <text x="948" y="486" class="box">跨 TP rank 共享</text>
    <text x="948" y="518" class="line">同一份主机缓存服务多个 rank</text>
    <text x="948" y="546" class="line">Prometheus 计数器观测命中率</text>

    <!-- arrows -->
    <line x1="810" y1="300" x2="880" y2="300" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="845" y="272" class="edge" text-anchor="middle" fill="#c2410c">溢出</text>
    <line x1="880" y1="500" x2="810" y2="500" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="845" y="530" class="edge" text-anchor="middle" fill="#0369a1">补齐</text>

    <!-- bottom panels -->
    <g filter="url(#shadow)">
      <rect x="50" y="640" width="730" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>
    <text x="80" y="682" class="panelhead">如何启用</text>
    <text x="80" y="716" class="line">通过 HiSparseConnector 启用主机分层</text>
    <text x="80" y="744" class="line">注意力配置由 connector 自动推断</text>
    <text x="80" y="772" class="line" fill="#94a3b8">适用于长上下文、低并发的稀疏 MLA 场景</text>

    <g filter="url(#shadow)">
      <rect x="820" y="640" width="730" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>
    <text x="850" y="682" class="panelhead">取舍</text>
    <text x="850" y="716" class="line">命中走显存热缓冲，延迟接近常驻</text>
    <text x="850" y="744" class="line">未命中需跨 PCIe / NVLink 取回</text>
    <text x="850" y="772" class="line" fill="#94a3b8">以部分取数延迟换取更大的有效 KV 容量</text>
  </g>
</svg>
