<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fast Start 常驻权重缓存</title>
  <desc id="desc">磁盘上的检查点首次加载时需读盘、反量化并按张量并行分片；权重缓存守护进程常驻每张 GPU，持有量化后且已分片的权重；引擎进程通过 --load-format ipc_cache 以 CUDA IPC 零拷贝映射这些权重，从而跳过读盘与量化，重启近乎瞬时。</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="0.34" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #0f172a; letter-spacing: -0.6px; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #64748b; }
      .head { font-size: 24px; font-weight: 800; fill: #172033; }
      .sub { font-size: 15px; font-weight: 700; }
      .line { font-size: 16px; font-weight: 500; fill: #55637a; }
      .edge { font-size: 14px; font-weight: 650; fill: #64748b; }
      .panelhead { font-size: 19px; font-weight: 800; fill: #172033; }
      .foot { font-size: 15px; font-weight: 650; fill: #475569; }
      .barlabel { font-size: 15px; font-weight: 700; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#page-bg)"/>

  <g class="sans">
    <text x="60" y="72" class="title">Fast Start：权重缓存守护进程常驻每张 GPU</text>
    <text x="60" y="110" class="subtitle">量化与 TP 切分只做一次，重启的引擎用 CUDA IPC 零拷贝接入，不再读盘</text>

    <!-- Card A: disk -->
    <g filter="url(#shadow)">
      <rect x="50" y="168" width="400" height="330" rx="18" fill="#ffffff" stroke="#dbe4f0" stroke-width="1.5"/>
    </g>
    <text x="80" y="212" class="head">磁盘检查点</text>
    <text x="80" y="240" class="sub" fill="#64748b">safetensors · 量化权重</text>
    <text x="80" y="288" class="line">引擎启动的固定开销来源</text>
    <text x="80" y="314" class="line">读盘 → 反量化 → TP 分片</text>
    <text x="80" y="340" class="line">每次进程重启都要重来</text>
    <text x="80" y="392" class="line" fill="#94a3b8">RL refit、改配置、崩溃恢复</text>
    <text x="80" y="418" class="line" fill="#94a3b8">都躲不开这段等待</text>

    <!-- arrow A -> B -->
    <line x1="450" y1="300" x2="540" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="495" y="286" class="edge" text-anchor="middle">首次</text>
    <text x="495" y="322" class="edge" text-anchor="middle">构建</text>

    <!-- Card B: daemon -->
    <g filter="url(#shadow)">
      <rect x="545" y="168" width="510" height="330" rx="18" fill="#eef4ff" stroke="#bfdbfe" stroke-width="2"/>
    </g>
    <text x="575" y="212" class="head" fill="#1d4ed8">权重缓存守护进程</text>
    <text x="575" y="240" class="sub" fill="#1d4ed8">按 GPU 常驻</text>
    <text x="575" y="288" class="line">持有量化后、TP 分片后的权重</text>
    <text x="575" y="314" class="line">保留在 GPU 显存中</text>
    <text x="575" y="340" class="line">本版本覆盖 FP4 检查点</text>
    <text x="575" y="366" class="line">本版本覆盖多节点 TP</text>
    <text x="575" y="418" class="line" fill="#64748b">GPU UUID socket 目录</text>
    <text x="575" y="444" class="line" fill="#64748b">按客户端导出 IPC 张量</text>

    <!-- arrow B -> C -->
    <line x1="1055" y1="300" x2="1145" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1100" y="286" class="edge" text-anchor="middle">重启</text>
    <text x="1100" y="322" class="edge" text-anchor="middle">映射</text>

    <!-- Card C: engine -->
    <g filter="url(#shadow)">
      <rect x="1150" y="168" width="400" height="330" rx="18" fill="#f4fdf9" stroke="#a7e3c8" stroke-width="1.5"/>
    </g>
    <text x="1180" y="212" class="head" fill="#047857">引擎进程</text>
    <text x="1180" y="240" class="sub" fill="#047857">--load-format ipc_cache</text>
    <text x="1180" y="288" class="line">CUDA IPC 直接映射权重</text>
    <text x="1180" y="314" class="line">零拷贝，不再读盘</text>
    <text x="1180" y="340" class="line">重启近乎瞬时</text>
    <text x="1180" y="392" class="line" fill="#94a3b8">copy 模式客户端</text>
    <text x="1180" y="418" class="line" fill="#94a3b8">单独导出，不污染共享权重</text>

    <!-- bottom timeline comparison -->
    <g filter="url(#shadow)">
      <rect x="50" y="545" width="1500" height="300" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>
    <text x="80" y="590" class="panelhead">两次启动的耗时构成</text>

    <text x="80" y="660" class="barlabel">首次启动</text>
    <rect x="230" y="638" width="230" height="30" rx="6" fill="#93c5fd"/>
    <text x="345" y="659" class="edge" text-anchor="middle" fill="#1e3a5f">读盘</text>
    <rect x="466" y="638" width="240" height="30" rx="6" fill="#fcd34d"/>
    <text x="586" y="659" class="edge" text-anchor="middle" fill="#7c4a03">反量化</text>
    <rect x="712" y="638" width="250" height="30" rx="6" fill="#a7f3d0"/>
    <text x="837" y="659" class="edge" text-anchor="middle" fill="#065f46">TP 分片</text>
    <line x1="1360" y1="628" x2="1360" y2="678" stroke="#0f172a" stroke-width="2"/>
    <text x="1375" y="659" class="edge" fill="#0f172a">就绪</text>

    <text x="80" y="760" class="barlabel">之后的每次重启</text>
    <rect x="230" y="738" width="120" height="30" rx="6" fill="#34d399"/>
    <text x="290" y="759" class="edge" text-anchor="middle" fill="#064e3b">IPC 映射</text>
    <line x1="420" y1="728" x2="420" y2="778" stroke="#0f172a" stroke-width="2"/>
    <text x="435" y="759" class="edge" fill="#0f172a">就绪</text>
    <text x="80" y="812" class="foot" fill="#94a3b8">读盘、反量化与 TP 分片被完全跳过，节省的时间随权重体积与 TP 规模放大</text>
  </g>
</svg>
