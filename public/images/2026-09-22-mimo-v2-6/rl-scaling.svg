<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">RL 训练 30 步的进展</title>
  <desc id="desc">MiMo-V2.6-Pro 与 MiMo-V2.6-Flash 在 DeepSWE v1.1 上随 RL 步数的分数变化，两者分别从 58.4 与 48.7 升至 72.6 与 65.7。</desc>
