<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MiMo-V2.6 关键基准对比</title>
  <desc id="desc">MiMo-V2.6-Pro 与 MiMo-V2.6-Flash 在七项基准上的得分，以及每项基准的最强竞品分数。</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="0.34" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #0f172a; letter-spacing: -0.6px; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #64748b; }
      .axis { font-size: 16px; font-weight: 600; fill: #94a3b8; }
      .rowlabel { font-size: 18px; font-weight: 700; fill: #172033; }
      .valin { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .vallow { font-size: 15px; font-weight: 700; fill: #ea580c; }
      .legend { font-size: 16px; font-weight: 650; fill: #475569; }
      .foot { font-size: 15px; font-weight: 600; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#page-bg)"/>
  <g class="sans">
    <text x="60" y="72" class="title">关键基准：MiMo-V2.6 与最强竞品的差距</text>
    <text x="60" y="110" class="subtitle">蓝条为 MiMo-V2.6-Pro，青条为 MiMo-V2.6-Flash，珊瑚色竖线为该基准最强竞品</text>

    <line x1="480" y1="222" x2="480" y2="800" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="480" y="210" class="axis" text-anchor="middle">0</text>
    <line x1="730" y1="222" x2="730" y2="800" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="730" y="210" class="axis" text-anchor="middle">25</text>
    <line x1="980" y1="222" x2="980" y2="800" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="980" y="210" class="axis" text-anchor="middle">50</text>
    <line x1="1230" y1="222" x2="1230" y2="800" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="1230" y="210" class="axis" text-anchor="middle">75</text>
    <line x1="1480" y1="222" x2="1480" y2="800" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="1480" y="210" class="axis" text-anchor="middle">100</text>

    <text x="60" y="288" class="rowlabel">DeepSWE v1.1</text>
    <rect x="480" y="246" width="719" height="26" rx="5" fill="#3b5f9e"/>
    <text x="1187" y="266" class="valin" text-anchor="end">71.9</text>
    <rect x="480" y="280" width="679" height="26" rx="5" fill="#14a08a"/>
    <text x="1147" y="300" class="valin" text-anchor="end">67.9</text>
    <line x1="1222" y1="240" x2="1222" y2="314" stroke="#f97316" stroke-width="3"/>
    <text x="1232" y="270" class="vallow">74.2</text>

    <text x="60" y="372" class="rowlabel">Toolathlon-verified</text>
    <rect x="480" y="330" width="769" height="26" rx="5" fill="#3b5f9e"/>
    <text x="1237" y="350" class="valin" text-anchor="end">76.9</text>
    <rect x="480" y="364" width="736" height="26" rx="5" fill="#14a08a"/>
    <text x="1204" y="384" class="valin" text-anchor="end">73.6</text>
    <line x1="1286" y1="324" x2="1286" y2="398" stroke="#f97316" stroke-width="3"/>
    <text x="1296" y="354" class="vallow">80.6</text>

    <text x="60" y="456" class="rowlabel">Automation Bench v1.0.6</text>
    <rect x="480" y="414" width="531" height="26" rx="5" fill="#3b5f9e"/>
    <text x="999" y="434" class="valin" text-anchor="end">53.1</text>
    <rect x="480" y="448" width="523" height="26" rx="5" fill="#14a08a"/>
    <text x="991" y="468" class="valin" text-anchor="end">52.3</text>
    <line x1="1028" y1="408" x2="1028" y2="482" stroke="#f97316" stroke-width="3"/>
    <text x="1038" y="438" class="vallow">54.8</text>

    <text x="60" y="540" class="rowlabel">Agents' Last Exam</text>
    <rect x="480" y="498" width="316" height="26" rx="5" fill="#3b5f9e"/>
    <text x="784" y="518" class="valin" text-anchor="end">31.6</text>
    <rect x="480" y="532" width="276" height="26" rx="5" fill="#14a08a"/>
    <text x="744" y="552" class="valin" text-anchor="end">27.6</text>
    <line x1="822" y1="492" x2="822" y2="566" stroke="#f97316" stroke-width="3"/>
    <text x="832" y="522" class="vallow">34.2</text>

    <text x="60" y="624" class="rowlabel">Terminal Bench 4.0</text>
    <rect x="480" y="582" width="349" height="26" rx="5" fill="#3b5f9e"/>
    <text x="817" y="602" class="valin" text-anchor="end">34.9</text>
    <rect x="480" y="616" width="288" height="26" rx="5" fill="#14a08a"/>
    <text x="756" y="636" class="valin" text-anchor="end">28.8</text>
    <line x1="1076" y1="576" x2="1076" y2="650" stroke="#f97316" stroke-width="3"/>
    <text x="1086" y="606" class="vallow">59.6</text>

    <text x="60" y="708" class="rowlabel">MiMo Visual Coding</text>
    <rect x="480" y="666" width="723" height="26" rx="5" fill="#3b5f9e"/>
    <text x="1191" y="686" class="valin" text-anchor="end">72.3</text>
    <rect x="480" y="700" width="715" height="26" rx="5" fill="#14a08a"/>
    <text x="1183" y="720" class="valin" text-anchor="end">71.5</text>
    <line x1="1302" y1="660" x2="1302" y2="734" stroke="#f97316" stroke-width="3"/>
    <text x="1312" y="690" class="vallow">82.2</text>

    <text x="60" y="792" class="rowlabel">CyberGym</text>
    <rect x="480" y="750" width="940" height="26" rx="5" fill="#3b5f9e"/>
    <text x="1408" y="770" class="valin" text-anchor="end">94.0</text>
    <rect x="480" y="784" width="951" height="26" rx="5" fill="#14a08a"/>
    <text x="1419" y="804" class="valin" text-anchor="end">95.1</text>
    <text x="1445" y="804" class="vallow">全场最高</text>

    <rect x="1180" y="150" width="18" height="14" rx="3" fill="#3b5f9e"/>
    <text x="1208" y="163" class="legend">MiMo-V2.6-Pro</text>
    <rect x="1180" y="176" width="18" height="14" rx="3" fill="#14a08a"/>
    <text x="1208" y="189" class="legend">MiMo-V2.6-Flash</text>
    <line x1="1189" y1="198" x2="1189" y2="216" stroke="#f97316" stroke-width="3"/>
    <text x="1208" y="213" class="legend">最强竞品</text>

    <text x="60" y="870" class="foot">分数越高越好。CyberGym 上 MiMo-V2.6-Flash 的 95.1 即为全场最高分；Terminal Bench 4.0 的 59.6 来自 GPT 6 Astra</text>
  </g>
</svg>
