<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">沙箱内的 runner 启动时序与元数据服务</title>
  <desc id="desc">ax-task-runner 作为 PID 1 分五步启动：读取 Task 与 Workspace、在 80 端口起元数据守护进程、首次准备每个 workspace、启动并监督 spec.command、命令结束后继续存活。同时提供 /healthz、/readyz 与两个元数据端点，guest services 仅在 debug 为真时开放。</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="0.34" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #0f172a; letter-spacing: -0.6px; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #64748b; }
      .step { font-size: 20px; font-weight: 800; fill: #172033; }
      .line { font-size: 14px; font-weight: 500; fill: #55637a; }
      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 13.5px; font-weight: 600; fill: #1d4ed8; }
      .note { font-size: 13px; font-weight: 650; fill: #94a3b8; }
      .panelhead { font-size: 18px; font-weight: 800; fill: #172033; }
      .foot { font-size: 15px; font-weight: 650; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#page-bg)"/>

  <g class="sans">
    <text x="60" y="72" class="title">沙箱启动：runner 是容器的 PID 1</text>
    <text x="60" y="110" class="subtitle">控制器固定启动 /usr/local/bin/ax-task-runner，命令只从 AX_TASK_YAML 里来</text>

    <!-- steps -->
    <g filter="url(#shadow)">
      <rect x="50" y="152" width="880" height="122" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="50" y="288" width="880" height="122" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="50" y="424" width="880" height="122" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="50" y="560" width="880" height="122" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="50" y="696" width="880" height="122" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>

    <circle cx="92" cy="192" r="19" fill="#1d4ed8"/>
    <text x="92" y="199" class="step" fill="#ffffff" text-anchor="middle">1</text>
    <text x="130" y="188" class="step">读取 Task 与每一个绑定的 Workspace</text>
    <text x="130" y="214" class="line">runner 的全部输入来自两个环境变量：AX_TASK_YAML 与</text>
    <text x="130" y="238" class="line">AX_WORKSPACES_YAML（后者的每一份文档对应一个 Workspace）</text>

    <circle cx="92" cy="328" r="19" fill="#1d4ed8"/>
    <text x="92" y="335" class="step" fill="#ffffff" text-anchor="middle">2</text>
    <text x="130" y="324" class="step">在 80 端口起元数据与 guest 管理守护进程</text>
    <text x="130" y="350" class="line">同一端口同时说 HTTP/1.1 与 h2c，暴露 /healthz、/readyz 与</text>
    <text x="130" y="374" class="line">/metadata/v1alpha1/ax/task、/metadata/v1alpha1/ax/workspaces</text>

    <circle cx="92" cy="464" r="19" fill="#b45309"/>
    <text x="92" y="471" class="step" fill="#ffffff" text-anchor="middle">3</text>
    <text x="130" y="460" class="step">首次启动时，按绑定顺序准备每个 workspace</text>
    <text x="130" y="486" class="line">克隆 git 仓库、建好技能目录；带 goal 的绑定会把这个目标交给</text>
    <text x="130" y="510" class="line">Antigravity 智能体补齐依赖，默认给 10 分钟，可用环境变量调整</text>

    <circle cx="92" cy="600" r="19" fill="#047857"/>
    <text x="92" y="607" class="step" fill="#ffffff" text-anchor="middle">4</text>
    <text x="130" y="596" class="step">启动 spec.command，并把它当子进程监督</text>
    <text x="130" y="622" class="line">工作目录是第一个 workspace，环境里带上 AX_METADATA_URL 与</text>
    <text x="130" y="646" class="line">spec.env；命令被放进独立进程组，方便整组发信号</text>

    <circle cx="92" cy="736" r="19" fill="#64748b"/>
    <text x="92" y="743" class="step" fill="#ffffff" text-anchor="middle">5</text>
    <text x="130" y="732" class="step">命令跑完之后，runner 继续活着</text>
    <text x="130" y="758" class="line">PID 1 在、容器就在：元数据服务仍能应答，ax ssh 也仍然可用；</text>
    <text x="130" y="782" class="line">命令的退出码只会被记进日志，控制面目前并不回读它</text>

    <!-- right column -->
    <g filter="url(#shadow)">
      <rect x="970" y="152" width="570" height="386" rx="18" fill="#eef4ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="970" y="560" width="570" height="258" rx="18" fill="#fffdf5" stroke="#fcd9a0" stroke-width="1.5"/>
    </g>

    <text x="1000" y="190" class="panelhead" fill="#1d4ed8">任务自己可以读的四个端点</text>
    <text x="1000" y="216" class="line">智能体不用任何 SDK，就能内省自己的配置</text>

    <text x="1000" y="256" class="mono">GET /healthz</text>
    <text x="1200" y="256" class="line">存活探针，永远 200</text>
    <text x="1000" y="292" class="mono">GET /readyz</text>
    <text x="1200" y="292" class="line">就绪前 503</text>
    <text x="1000" y="328" class="mono">/metadata/v1alpha1/</text>
    <text x="1000" y="350" class="mono">ax/task</text>
    <text x="1200" y="339" class="line">当前 Task 的完整</text>
    <text x="1200" y="361" class="line">spec 与 status（YAML）</text>

    <text x="1000" y="397" class="mono">/metadata/v1alpha1/</text>
    <text x="1000" y="419" class="mono">ax/workspaces</text>
    <text x="1200" y="408" class="line">全部绑定 Workspace 的</text>
    <text x="1200" y="430" class="line">多文档 YAML 流</text>

    <text x="1000" y="472" class="line" fill="#94a3b8">容器内直接取用：</text>
    <text x="1000" y="498" class="mono">curl -s "$AX_METADATA_URL/metadata/v1alpha1/ax/task"</text>
    <text x="1000" y="524" class="line" fill="#94a3b8">控制器也轮询同一个 /readyz 来置 WorkspaceReady</text>

    <text x="1000" y="598" class="panelhead" fill="#b45309">guest services 默认关着</text>
    <text x="1000" y="628" class="line">只有 spec.debug 为 true，runner 才会在同一端口用 gRPC</text>
    <text x="1000" y="652" class="line">开放进程服务与文件系统服务——它们允许任意进程执行和</text>
    <text x="1000" y="676" class="line">文件读写，所以默认关闭，ax ssh 也拒绝连接没开启的任务。</text>
    <text x="1000" y="712" class="line" fill="#94a3b8">停机路径：SIGTERM → 转发给命令进程组 → 等 10 秒 →</text>
    <text x="1000" y="736" class="line" fill="#94a3b8">SIGKILL 剩余进程；挂起前必须把状态落到持久卷上。</text>
    <text x="1000" y="776" class="line">持久卷 /workspace 是唯一跨 suspend / resume 存活的东西：</text>
    <text x="1000" y="800" class="line">恢复得到同一批文件，但换了一棵全新的进程树。</text>

    <rect x="50" y="860" width="1490" height="58" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="80" y="896" class="foot">默认 runner 镜像基于 Python 3.12，预装 git、curl、ssh 客户端与 Antigravity 智能体</text>
    <text x="1510" y="896" class="foot" text-anchor="end" fill="#b45309">workspace 准备只做一次，靠持久卷上的标记文件跳过重复克隆</text>
  </g>
</svg>
