<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">AutoKernel 的三阶段流水线</title>
  <desc id="desc">阶段 A 剖析模型并按 Amdahl 定律抽取瓶颈 kernel；阶段 B 由智能体在单一文件上反复编辑、评测、保留或回退；阶段 C 将优化后的 kernel 换回模型做端到端验证。每次迭代约 90 秒。</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="0.34" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #0f172a; letter-spacing: -0.6px; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #64748b; }
      .phase { font-size: 20px; font-weight: 800; }
      .phase-sub { font-size: 14px; font-weight: 600; fill: #94a3b8; }
      .head { font-size: 17px; font-weight: 750; fill: #172033; }
      .line { font-size: 14px; font-weight: 500; fill: #55637a; }
      .foot { font-size: 15px; font-weight: 650; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="950" fill="url(#page-bg)"/>

  <g class="sans">
    <text x="60" y="72" class="title">AutoKernel：从任意 PyTorch 模型到优化后的 GPU kernel</text>
    <text x="60" y="110" class="subtitle">三阶段流水线 · 一次运行 300–400 次实验 · 每次迭代约 90 秒</text>

    <g filter="url(#shadow)">
      <rect x="55" y="150" width="470" height="690" rx="23" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="565" y="150" width="470" height="690" rx="23" fill="#fffdf5" stroke="#fde68a" stroke-width="1.5"/>
      <rect x="1075" y="150" width="470" height="690" rx="23" fill="#f4fdf9" stroke="#a7f3d0" stroke-width="1.5"/>
    </g>

    <!-- Phase A -->
    <g>
      <text x="85" y="192" class="phase" fill="#1d4ed8">阶段 A · 模型分析</text>
      <text x="85" y="215" class="phase-sub">人机交互 · 约 15 分钟</text>

      <rect x="85" y="235" width="410" height="86" rx="14" fill="#ffffff" stroke="#c7d9f5" stroke-width="1.5"/>
      <text x="105" y="267" class="head">任意 PyTorch 模型</text>
      <text x="105" y="292" class="line">本地 .py 文件、HuggingFace 模型 ID 或自定义类</text>
      <text x="105" y="312" class="line">外加输入形状（如 1,2048）与计算精度</text>

      <line x1="290" y1="321" x2="290" y2="349" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="85" y="351" width="410" height="118" rx="14" fill="#ffffff" stroke="#c7d9f5" stroke-width="1.5"/>
      <text x="105" y="383" class="head">profile.py · 找出谁在吃 GPU 时间</text>
      <text x="105" y="409" class="line">torch.profiler 记录每个 CUDA kernel 的耗时</text>
      <text x="105" y="431" class="line">按名称模式归类：cuBLAS / CUTLASS / Triton / ATen</text>
      <text x="105" y="453" class="line">映射到 9 种算子类型，并识别 H100、MI300X 规格</text>

      <line x1="290" y1="469" x2="290" y2="497" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="85" y="499" width="410" height="118" rx="14" fill="#ffffff" stroke="#c7d9f5" stroke-width="1.5"/>
      <text x="105" y="531" class="head">排名 + roofline 判定</text>
      <text x="105" y="557" class="line">按 GPU 时间占比排序，取前 5–10 个瓶颈</text>
      <text x="105" y="579" class="line">算算术强度，判定 compute / memory bound</text>
      <text x="105" y="601" class="line">用 Amdahl 定律给出每个 kernel 的端到端上限</text>

      <line x1="290" y1="617" x2="290" y2="645" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="85" y="647" width="410" height="110" rx="14" fill="#ffffff" stroke="#c7d9f5" stroke-width="1.5"/>
      <text x="105" y="679" class="head">extract.py · 抽出可独立优化的 kernel</text>
      <text x="105" y="705" class="line">每个瓶颈生成一个文件（Triton 或 CUDA C++ 起步版）</text>
      <text x="105" y="727" class="line">自带模型专属 shape，以及半尺寸、双尺寸变体</text>
      <text x="105" y="749" class="line">自带 FLOPS / BYTES 公式与各精度容差</text>
    </g>

    <!-- Phase B -->
    <g>
      <text x="595" y="192" class="phase" fill="#b45309">阶段 B · 自主优化循环</text>
      <text x="595" y="215" class="phase-sub">无人值守 · 10 小时以上</text>

      <rect x="595" y="235" width="410" height="104" rx="14" fill="#ffffff" stroke="#fcd9a0" stroke-width="1.5"/>
      <text x="615" y="267" class="head">① 智能体只改一个文件 kernel.py</text>
      <text x="615" y="292" class="line">每轮一处聚焦改动，例如 BLOCK_SIZE_M 从 64 调到 128</text>
      <text x="615" y="312" class="line">改动前先 git commit，失败时可干净回退</text>

      <line x1="800" y1="339" x2="800" y2="367" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="595" y="369" width="410" height="116" rx="14" fill="#ffffff" stroke="#fcd9a0" stroke-width="1.5"/>
      <text x="615" y="401" class="head">② bench.py · 五阶段正确性 + 性能</text>
      <text x="615" y="427" class="line">冒烟 → 形状扫描 → 数值稳定 → 确定性 → 边界</text>
      <text x="615" y="449" class="line">任一阶段失败即判定失败，根本不测吞吐</text>
      <text x="615" y="471" class="line">基准与参考实现固定不可改，杜绝「改考卷」</text>

      <line x1="800" y1="485" x2="800" y2="513" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="595" y="515" width="410" height="116" rx="14" fill="#ffffff" stroke="#fcd9a0" stroke-width="1.5"/>
      <text x="615" y="547" class="head">③ 通过且吞吐 &gt; 1.01× ？</text>
      <text x="615" y="573" class="line">是 → keep，成为新的基线</text>
      <text x="615" y="595" class="line">否 → git reset --hard HEAD~1</text>
      <text x="615" y="617" class="line">吞吐持平时，若代码明显更简单也予以保留</text>

      <line x1="800" y1="631" x2="800" y2="659" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="595" y="661" width="410" height="96" rx="14" fill="#ffffff" stroke="#fcd9a0" stroke-width="1.5"/>
      <text x="615" y="693" class="head">④ 记入 results.tsv，再问 orchestrator</text>
      <text x="615" y="719" class="line">CONTINUE / NEXT / REVISIT / DONE</text>
      <text x="615" y="741" class="line">每行一个实验：吞吐、延迟、%峰值、正确性、VRAM</text>
    </g>

    <!-- Phase C -->
    <g>
      <text x="1105" y="192" class="phase" fill="#047857">阶段 C · 端到端验证</text>
      <text x="1105" y="215" class="phase-sub">自动执行 · 人工复核</text>

      <rect x="1105" y="235" width="410" height="110" rx="14" fill="#ffffff" stroke="#a7e3c8" stroke-width="1.5"/>
      <text x="1125" y="267" class="head">把优化后的 kernel 换回模型</text>
      <text x="1125" y="292" class="line">nn.Linear → matmul kernel</text>
      <text x="1125" y="314" class="line">nn.LayerNorm → layernorm，注意力 → flash_attention</text>
      <text x="1125" y="336" class="line">按模块类型逐个替换，其余部分保持原样</text>

      <line x1="1310" y1="345" x2="1310" y2="373" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="1105" y="375" width="410" height="110" rx="14" fill="#ffffff" stroke="#a7e3c8" stroke-width="1.5"/>
      <text x="1125" y="407" class="head">跑一遍完整推理并比对输出</text>
      <text x="1125" y="432" class="line">与原始 PyTorch 算子的结果逐元素比较</text>
      <text x="1125" y="454" class="line">单 kernel 全对，不等于拼起来全对</text>
      <text x="1125" y="476" class="line">精度漂移会在这里暴露出来</text>

      <line x1="1310" y1="485" x2="1310" y2="513" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="1105" y="515" width="410" height="110" rx="14" fill="#ffffff" stroke="#a7e3c8" stroke-width="1.5"/>
      <text x="1125" y="547" class="head">报告总体加速比</text>
      <text x="1125" y="572" class="line">只有正确性通过且加速比大于 1.0 才算成功</text>
      <text x="1125" y="594" class="line">否则说明 kernel 切换的开销吃掉了收益</text>
      <text x="1125" y="616" class="line">反向替换回 PyTorch 实现即可退回</text>

      <line x1="1310" y1="625" x2="1310" y2="653" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="1105" y="655" width="410" height="102" rx="14" fill="#ffffff" stroke="#a7e3c8" stroke-width="1.5"/>
      <text x="1125" y="687" class="head">--diagnose · 逐个 kernel 定位</text>
      <text x="1125" y="713" class="line">单独测试每一个 kernel 替换，找出肇事者</text>
      <text x="1125" y="735" class="line">放宽该 kernel 的优化（如改用 fp32 累加）后重跑</text>
    </g>

    <!-- Footer -->
    <rect x="55" y="866" width="1490" height="62" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="85" y="903" class="foot">换 kernel 的条件：连续 5 次回退 ｜ 已达理论峰值 90% ｜ 单 kernel 用满 2 小时 ｜ 已拿到 2× 加速</text>
    <text x="1515" y="903" class="foot" text-anchor="end" fill="#b45309">≈90 秒/次 → 40 次/小时 → 一夜 300–400 次实验</text>
  </g>
</svg>
