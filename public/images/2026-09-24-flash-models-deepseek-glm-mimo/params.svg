<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" font-family="'Noto Sans CJK SC','Noto Sans SC','WenQuanYi Micro Hei',sans-serif">
  <rect width="1040" height="540" fill="#ffffff"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#1a1b26">四款 Flash 模型：总参数 vs 激活参数</text>
  <text x="40" y="74" font-size="14" fill="#868e96">数据来源：各厂商官方模型卡（2026 年）</text>

  <g font-size="13" fill="#495057">
    <rect x="700" y="34" width="14" height="14" fill="#adb5bd"/>
    <text x="720" y="46">总参数</text>
    <rect x="790" y="34" width="14" height="14" fill="#343a40"/>
    <text x="810" y="46">激活参数</text>
  </g>

  <!-- grid -->
  <g stroke="#e9ecef" stroke-width="1">
    <line x1="250" y1="110" x2="250" y2="470"/>
    <line x1="373" y1="110" x2="373" y2="470"/>
    <line x1="496" y1="110" x2="496" y2="470"/>
    <line x1="619" y1="110" x2="619" y2="470"/>
    <line x1="742" y1="110" x2="742" y2="470"/>
    <line x1="865" y1="110" x2="865" y2="470"/>
  </g>
  <g font-size="12" fill="#adb5bd" text-anchor="middle">
    <text x="250" y="492">0</text>
    <text x="373" y="492">100B</text>
    <text x="496" y="492">200B</text>
    <text x="619" y="492">300B</text>
    <text x="742" y="492">400B</text>
    <text x="865" y="492">500B</text>
  </g>

  <!-- DeepSeek V4 Flash: 284B / 13B -->
  <g>
    <text x="234" y="152" font-size="15" font-weight="600" fill="#1a1b26" text-anchor="end">DeepSeek V4 Flash</text>
    <rect x="250" y="128" width="349" height="44" rx="3" fill="#748ffc"/>
    <rect x="250" y="128" width="16" height="44" rx="3" fill="#343a40"/>
    <text x="611" y="156" font-size="14" font-weight="700" fill="#4263eb">284B</text>
    <text x="278" y="156" font-size="13" fill="#ffffff">激活 13B</text>
  </g>

  <!-- DeepSeek V4.1 Flash: 552B / 8B·16B -->
  <g>
    <text x="234" y="252" font-size="15" font-weight="600" fill="#1a1b26" text-anchor="end">DeepSeek V4.1 Flash</text>
    <rect x="250" y="228" width="679" height="44" rx="3" fill="#4263eb"/>
    <rect x="250" y="228" width="10" height="44" rx="3" fill="#343a40"/>
    <text x="941" y="256" font-size="14" font-weight="700" fill="#4263eb">552B</text>
    <text x="272" y="256" font-size="13" fill="#ffffff">激活 8B / 16B（非对称）</text>
  </g>

  <!-- GLM-5.3-Flash: 320B / 18B -->
  <g>
    <text x="234" y="352" font-size="15" font-weight="600" fill="#1a1b26" text-anchor="end">GLM-5.3-Flash</text>
    <rect x="250" y="328" width="394" height="44" rx="3" fill="#40c057"/>
    <rect x="250" y="328" width="22" height="44" rx="3" fill="#343a40"/>
    <text x="656" y="356" font-size="14" font-weight="700" fill="#2f9e44">320B</text>
    <text x="284" y="356" font-size="13" fill="#ffffff">激活 18B</text>
  </g>

  <!-- MiMo-V2.6-Flash: 309B / 15B -->
  <g>
    <text x="234" y="452" font-size="15" font-weight="600" fill="#1a1b26" text-anchor="end">MiMo-V2.6-Flash</text>
    <rect x="250" y="428" width="381" height="44" rx="3" fill="#ff922b"/>
    <rect x="250" y="428" width="19" height="44" rx="3" fill="#343a40"/>
    <text x="643" y="456" font-size="14" font-weight="700" fill="#f76707">309B</text>
    <text x="281" y="456" font-size="13" fill="#ffffff">激活 15B</text>
  </g>

  <text x="40" y="522" font-size="12" fill="#adb5bd">四款均为 1M 上下文、MIT 许可；V4.1 Flash 的 8B / 16B 指预填充 / 解码阶段的非对称激活</text>
</svg>
